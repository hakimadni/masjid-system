services:
  app:
    build:
      context: ./
    container_name: masjid-system-app
    volumes:
      - ./:/var/www/html
    networks:
      - masjid-system
    restart: unless-stopped

  web:
    image: nginx:latest
    container_name: masjid-system-web
    ports:
      - '8087:80'
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - masjid-system
    restart: unless-stopped

networks:
  masjid-system:
